# HTTPS front-end for wlanpi-mcp.
#
# Installed by the wlanpi-mcp package and linked into /etc/nginx/sites-enabled
# by its postinst (via wlanpi-mcp-nginx-setup.sh); removed again by postrm.
# Terminates TLS with the device certificate that wlanpi-core's postinst
# generates and proxies to the MCP daemon on loopback. nginx does TLS and
# proxying only: MCP authentication stays the wlanpi-core JWT that the client
# sends as 'Authorization: Bearer' and the daemon passes through to core.
#
# The daemon binds to 127.0.0.1:8766 (WLANPI_MCP_HOST/WLANPI_MCP_PORT in
# /etc/wlanpi-mcp/config.env) so the cleartext port is not reachable from the
# LAN, and the package's UFW profile opens 8767 only. If you change the
# daemon port, change proxy_pass to match.
#
# Logs use nginx's built-in 'combined' format so this site does not depend on
# a log_format declared by another package's site file.

server {
    listen 8767 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed-wlanpi.cert;
    ssl_certificate_key /etc/nginx/ssl/self-signed-wlanpi.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wlanpi_mcp_tls:1m;
    ssl_session_timeout 1d;

    access_log /var/log/wlanpi-mcp/nginx_access.log combined;
    error_log /var/log/wlanpi-mcp/nginx_error.log;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The SSE transport streams the response for the life of the session:
        # keep the upstream connection open and never buffer.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:8766;
    }
}
